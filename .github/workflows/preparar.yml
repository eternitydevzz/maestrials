# MaesTrials — B2: cada día monta las versiones que faltan (ffmpeg + Whisper + Claude) y las deja en public/v/.
name: preparar

on:
  schedule:
    - cron: "5 11 * * *"     # 11:05 UTC = 6:05 NY (invierno) / 7:05 NY (verano): antes del primer hueco (10:00 NY)
  workflow_dispatch:
    inputs:
      videos:
        description: "Ids de vídeo separados por espacios (vacío = elegir solo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automatico/requisitos.txt
      - name: Instalar ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Instalar paquetes de Python
        run: python -m pip install -q -r automatico/requisitos.txt
      - name: Guardar el modelo de Whisper entre ejecuciones
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Actualizar ganadores si toca
        continue-on-error: true   # si falla, se prepara con la lista anterior
        run: python -X utf8 automatico/ganadores_si_toca.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
      - name: Preparar
        run: python -X utf8 automatico/preparar.py $VIDEOS
        env:
          VIDEOS: ${{ inputs.videos }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar en el repo
        if: always()           # aunque falle un vídeo, se guardan los que salieron bien
        run: |
          git config user.name "eternitydevzz"
          git config user.email "336098555+eternitydevzz@users.noreply.github.com"
          git add public/v datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: versiones preparadas"
          git pull --rebase
          git push
      - name: Recordatorio de renovar el token de cron-job.org
        if: always()           # se comprueba aunque preparar falle; sale en rojo 14 días antes de caducar
        run: python -X utf8 automatico/aviso_token.py
