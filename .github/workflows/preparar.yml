# MaesTrials — B2: cada día monta las versiones que faltan (ffmpeg + Whisper + Claude) y las deja en public/v/.
# Hace las dos cuentas: Jose (public/v/, datos/) y Cristian (public/v/cristian/, datos/cristian/).
name: preparar

on:
  schedule:
    - cron: "5 11 * * *"     # 11:05 UTC = 6:05 NY (invierno) / 7:05 NY (verano): antes del primer hueco (10:00 NY)
  workflow_dispatch:
    inputs:
      cuenta:
        description: "jose o cristian (vacío = las dos)"
        required: false
        default: ""
      videos:
        description: "Ids de vídeo separados por espacios (vacío = elegir solo; hace falta elegir cuenta)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 50       # las dos cuentas: hasta 3 + 5 versiones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automatico/requisitos.txt
      - name: Instalar ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Instalar paquetes de Python
        run: python -m pip install -q -r automatico/requisitos.txt
      - name: Guardar el modelo de Whisper entre ejecuciones
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Ganadores si toca y preparar (cada cuenta)
        # si falla ganadores, se prepara con la lista anterior; si falla una cuenta, la otra sigue y al final sale en rojo
        run: |
          if [ -n "$VIDEOS" ] && [ -z "$CUENTA" ]; then echo "::error::Para elegir vídeos hay que elegir cuenta"; exit 1; fi
          fallo=0
          for cuenta in ${CUENTA:-jose cristian}; do
            echo "::group::Cuenta $cuenta"
            MT_CUENTA=$cuenta python -X utf8 automatico/ganadores_si_toca.py || echo "::warning::ganadores falló en $cuenta"
            MT_CUENTA=$cuenta python -X utf8 automatico/preparar.py $VIDEOS || { echo "::error::preparar falló en $cuenta"; fallo=1; }
            echo "::endgroup::"
          done
          exit $fallo
        env:
          CUENTA: ${{ inputs.cuenta }}
          VIDEOS: ${{ inputs.videos }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_CRISTIAN: ${{ secrets.IG_TOKEN_CRISTIAN }}
          IG_USER_ID_CRISTIAN: ${{ secrets.IG_USER_ID_CRISTIAN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}   # vídeos de Cristian (Supabase Storage)
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
      - name: Guardar en el repo
        if: always()           # aunque falle un vídeo, se guardan los que salieron bien
        run: |
          git config user.name "eternitydevzz"
          git config user.email "336098555+eternitydevzz@users.noreply.github.com"
          git add public/v datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: versiones preparadas"
          git pull --rebase
          git push
      - name: Recordatorio de renovar el token de cron-job.org
        if: always()           # se comprueba aunque preparar falle; sale en rojo 14 días antes de caducar
        run: python -X utf8 automatico/aviso_token.py
