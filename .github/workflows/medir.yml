# MaesTrials — B1: mide los trials y guarda la foto de las 24 h en datos/publicaciones.json.
# Desde el B3 lo mide cada hora la tarea "autopilot"; esta queda solo para lanzarla a mano.
name: medir

on:
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write             # para guardar los datos en el repo

concurrency:
  group: datos                # nunca dos tareas escribiendo datos/ a la vez
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Medir
        run: python -I -X utf8 automatico/medir.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
      - name: Guardar en el repo
        run: |
          git config user.name "eternitydevzz"
          git config user.email "336098555+eternitydevzz@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: medir trials"
          git pull --rebase
          git push
