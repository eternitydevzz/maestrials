# MaesTrials — B3: cada hora mide los trials y, si toca un hueco, publica el siguiente.
# Hace las dos cuentas, una detrás de otra: Jose (datos/) y Cristian (datos/cristian/). Horas en cada ajustes.json.
name: autopilot

on:
  schedule:
    - cron: "7 * * * *"      # minuto 7 de cada hora (UTC). GitHub puede retrasarlo unos minutos.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # esperar a que Instagram procese un vídeo puede tardar hasta 10 min (x2 cuentas)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Medir y publicar si toca (las dos cuentas)
        # si falla medir, se publica igual; si falla publicar en una cuenta, la otra sigue y al final sale en rojo
        run: |
          fallo=0
          for cuenta in jose cristian; do
            echo "::group::Cuenta $cuenta"
            MT_CUENTA=$cuenta python -X utf8 automatico/medir.py || echo "::warning::medir falló en $cuenta"
            MT_CUENTA=$cuenta python -X utf8 automatico/publicar.py || { echo "::error::publicar falló en $cuenta"; fallo=1; }
            echo "::endgroup::"
          done
          exit $fallo
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_CRISTIAN: ${{ secrets.IG_TOKEN_CRISTIAN }}
          IG_USER_ID_CRISTIAN: ${{ secrets.IG_USER_ID_CRISTIAN }}
          GRAPH_BASE: ${{ secrets.GRAPH_BASE }}
      - name: Guardar en el repo
        if: always()              # lo publicado se guarda aunque algo falle después
        run: |
          git config user.name "eternitydevzz"
          git config user.email "336098555+eternitydevzz@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: autopilot"
          git pull --rebase
          git push
