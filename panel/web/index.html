<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MaesTrials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
  <header class="cabecera">
    <div class="marca"><span class="logo">M</span>MaesTrials <span class="cuenta" id="cuenta"></span> <a class="cuenta otra-cuenta" id="otra-cuenta" hidden></a></div>
    <nav class="pestanas" aria-label="Secciones">
      <button data-vista="versiones">Versiones</button>
      <button data-vista="ganadores">Ganadores</button>
      <button data-vista="resultados">Resultados</button>
    </nav>
    <div class="controles">
      <label class="interruptor" title="Con el autopilot encendido, GitHub publica solo en los huecos">
        <input type="checkbox" id="autopilot" disabled>
        <span class="pista" aria-hidden="true"></span>
        <span id="autopilot-texto">Autopilot</span>
      </label>
      <button class="boton-suave" id="sincronizar" title="Traer lo último que hizo GitHub">Sincronizar</button>
    </div>
  </header>
  <div class="aviso-flotante" id="aviso" role="status" hidden></div>
  <main id="contenido"></main>
  <script src="/panel.js"></script>
</body>
</html>
